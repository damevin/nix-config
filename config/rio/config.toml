# See the full configuration reference: https://rioterm.com/docs/config
theme = "main-dark"

env-vars = [
  "TERMINFO_DIRS=/run/current-system/sw/share/terminfo:/usr/share/terminfo",
]

[navigation]
mode = "Tab"
max-tab-width = 280

[title]
content = "{{ TITLE || RELATIVE_PATH }}"

[shell]
program = "/bin/zsh"
args = []

[bindings]
keys = [
  { key = "d", with = "control | shift", action = "SplitRight" },
  { key = "d", with = "control | shift | alt", action = "SplitDown" },
  { key = "]", with = "super", action = "SelectNextSplit" },
  { key = "[", with = "super", action = "SelectPrevSplit" },
]
